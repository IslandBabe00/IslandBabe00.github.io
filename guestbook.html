<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沙滩留言板 ✦ ISLAND_Y2K_SPACE</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://cdn.cursors-4u.net/cursors/animated/cute-ears-doll-girl-9aaba74d-32.css"
  />
</head>
<body>
  <div class="guestbook-page">
    <div class="marquee-container">
      <div class="marquee-text">
        🐚 GUESTBOOK.DAT ✦ 在这里留下你的脚印吧！ ✦ SAY HELLO &amp; STAY SALTY 🐚
      </div>
    </div>

    <!-- 留言列表窗口：按时间倒序，最新在最上方 -->
    <div class="window">
      <div class="window-header">
        <span>💬 全部留言（1）</span>
        <div class="window-controls"><span>_</span><span>X</span></div>
      </div>
      <div class="window-body">
        <ul class="guestbook-list">
          <li class="guestbook-item">
            <div class="guestbook-item-header">
              <span class="guestbook-rank">#1</span>
              <b class="guestbook-name">宇</b>
              <span class="small-text guestbook-time">2026-08-16</span>
            </div>
            <p class="guestbook-message-text">你的设计很棒</p>
          </li>
        </ul>
        <p class="small-text" style="margin-top:12px;">
          本站为静态快照，暂不支持在线留言提交。
        </p>
        <div class="guestbook-form-actions" style="margin-top:12px;">
          <a href="index.html" class="y2k-btn">← 返回首页</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
